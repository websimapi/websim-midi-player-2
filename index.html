<div class="player-controls">
    <button id="play-button" disabled>Play</button>
    <button id="stop-button" disabled>Stop</button>
    <button id="restart-button" disabled>Restart</button>
</div>
<div class="toggle-container">
    <span class="toggle-label">Original</span>
    <label class="toggle-switch">
        <input type="checkbox" id="ai-toggle">
        <span class="slider"></span>
    </label>
    <span class="toggle-label">AI Mode</span>
</div>
<div class="toggle-container">
    <span class="toggle-label">15 Sec</span>
    <label class="toggle-switch">
        <input type="checkbox" id="full-analysis-toggle">
        <span class="slider"></span>
    </label>
    <span class="toggle-label">Full Song</span>
</div>
<p class="status-message" id="status-message"></p>
