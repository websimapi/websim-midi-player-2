<div class="toggle-container">
    <span class="toggle-label">Original</span>
    <label class="toggle-switch">
        <input type="checkbox" id="ai-toggle">
        <span class="slider"></span>
    </label>
    <span class="toggle-label">AI Mode</span>
</div>
<div class="toggle-container">
    <span class="toggle-label">Capture: </span>
    <select id="capture-duration">
        <option value="15">15 seconds</option>
        <option value="30">30 seconds</option>
        <option value="60">60 seconds</option>
        <option value="full">Full song</option>
    </select>
    <button id="restart-button" disabled>Restart</button>
</div>
<p class="status-message" id="status-message"></p>
