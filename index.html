<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Player with AI Suggestions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>MIDI Music Player</h1>
        <div class="upload-section">
            <label for="midi-upload" class="upload-button">
                <span>Upload MIDI File</span>
                <input type="file" id="midi-upload" accept=".mid,.midi">
            </label>
            <p class="file-name" id="file-name">No file selected</p>
        </div>
        <div class="player-controls">
            <button id="play-button" disabled>Play</button>
            <button id="stop-button" disabled>Stop</button>
        </div>
        <div class="toggle-container">
            <span class="toggle-label">Original</span>
            <label class="toggle-switch">
                <input type="checkbox" id="ai-toggle">
                <span class="slider"></span>
            </label>
            <span class="toggle-label">AI Mode</span>
        </div>
        <p class="status-message" id="status-message"></p>
        <div class="visualizer">
            <div id="piano-container"></div>
            <div id="notes-container"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
    <script src="script.js"></script>

</body>
</html>
